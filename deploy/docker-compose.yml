# Phase 1: CLI renderer as a container. Phase 2 adds the web app and PostgreSQL.
#
#   docker compose -f deploy/docker-compose.yml build
#   docker compose -f deploy/docker-compose.yml run --rm rf render /data/acme-webshop
#
services:
  rf:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: reportforge:local
    volumes:
      - ../examples:/data            # put your engagement folders here (or change the path)
      - ../modules/themes:/opt/reportforge/modules/themes   # client themes live outside the image
    environment:
      - TZ=Europe/Amsterdam
