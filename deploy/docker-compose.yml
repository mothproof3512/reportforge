# Reportforge on the NUC.
#   docker compose -f deploy/docker-compose.yml up -d --build
#   → http://<nuc-ip>:3000  (set your password on first visit)
#
# Data (SQLite, screenshots, renders, engagement folders) lives in ../data;
# client themes live in ../modules/themes so they are files you can also keep in git.
services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: reportforge:local
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ../data:/data
      - ../modules/themes:/opt/reportforge/modules/themes
    environment:
      - TZ=Europe/Amsterdam
  # One-off CLI renders use the same image:
  #   docker compose -f deploy/docker-compose.yml run --rm web npx tsx packages/cli/src/index.ts render /data/engagements/PT-2026-042
