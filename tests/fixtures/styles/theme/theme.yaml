# Exercises the non-default variant of every layout element.
page: { cover: split }
options:
  heading_style: bar
  table_style: zebra
  chart_style: donut
  callout_style: ribbon
  badge_style: tag
  finding_layout: card
  decorations:
    - { image: ring.svg, anchor: bottom-right, dx: 50mm, dy: 50mm, width: 170mm, opacity: 0.07, pages: odd }
    - { image: blob.svg, anchor: top-left, dx: -40mm, dy: -30mm, width: 120mm, rotate: 25deg, opacity: 0.08, blur: 6, tint: accent, pages: even }
    - { image: dots.svg, anchor: top-right, dx: 10mm, dy: 30mm, width: 70mm, opacity: 0.25, tint: muted, pages: cover }
