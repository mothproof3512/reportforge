id: wstg-4.2
name: OWASP Web Security Testing Guide
short: WSTG
version: "4.2"
kind: methodology
url: https://owasp.org/www-project-web-security-testing-guide/v42/
description:
  nl: De OWASP Web Security Testing Guide (WSTG) beschrijft per testcategorie welke controles een webapplicatie moet doorstaan. De test is uitgevoerd aan de hand van de WSTG-testcases die voor de scope relevant zijn.
  en: The OWASP Web Security Testing Guide (WSTG) describes, per test category, the checks a web application must pass. Testing followed the WSTG test cases relevant to the scope.
