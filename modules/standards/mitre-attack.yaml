description:
  nl: MITRE ATT&CK beschrijft tactieken en technieken van aanvallers. Bevindingen uit infrastructuur- en red-team-opdrachten zijn gekoppeld aan de techniek die ermee mogelijk wordt. Subset van veelgebruikte technieken; uitbreidbaar in modules/standards/mitre-attack.yaml.
  en: MITRE ATT&CK describes adversary tactics and techniques. Findings from infrastructure and red-team engagements are mapped to the technique they enable. Subset of common techniques; extend in modules/standards/mitre-attack.yaml.
